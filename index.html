<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digimap & Digiplus Assessment - Staged Dashboard</title>
    <style>
        :root {
            --primary: #0071e3;
            --success: #34c759;
            --warning: #ff9500;
            --danger: #ff3b30;
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
            --text-secondary: #6e6e73;
            --border: #d2d2d7;
            --gray-bg: #f9f9fb;
            --radius: 14px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }
        header { text-align: center; margin-bottom: 25px; }
        h1 { font-size: 22px; font-weight: 700; margin: 0 0 5px 0; }
        .subtitle { font-size: 13px; color: var(--text-secondary); }
        
        .meta-box {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            background: var(--gray-bg);
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }
        .form-group label {
            font-weight: 600;
            font-size: 12px;
            display: block;
            margin-bottom: 5px;
        }
        .form-group select, .form-group input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            background: #fff;
            box-sizing: border-box;
        }

        .phase-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .phase-card {
            background: var(--gray-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .phase-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        .phase-card.completed {
            border-color: var(--success);
            background: #f0fdf4;
        }
        .phase-title {
            font-weight: 700;
            font-size: 15px;
            color: var(--primary);
            margin-bottom: 5px;
        }
        .phase-card.completed .phase-title { color: #166534; }
        .phase-desc { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; }
        .phase-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 12px;
            background: #e5e5ea;
            color: #3a3a3c;
        }
        .phase-card.completed .phase-badge {
            background: #dcfce7;
            color: #16a34a;
        }

        .assessment-view { display: none; }
        .assessment-view.active { display: block; }
        
        .back-btn {
            background: #e5e5ea; border: none; padding: 8px 14px;
            font-weight: 600; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 20px;
        }
        .item-card {
            background: var(--gray-bg); border: 1px solid #e5e5ea;
            border-radius: 8px; padding: 15px; margin-bottom: 15px;
        }
        .item-title { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
        .criteria-text {
            font-size: 11px; background: #fff; padding: 10px; border-radius: 6px;
            border-left: 3px solid var(--primary); margin-bottom: 10px; white-space: pre-line;
        }
        .score-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
        .pill-btn {
            flex: 1; min-width: 40px; padding: 8px; text-align: center;
            border: 1px solid var(--border); border-radius: 6px; background: #fff;
            font-weight: 600; font-size: 13px; cursor: pointer;
        }
        .pill-btn.selected { background: var(--primary); color: #fff; border-color: var(--primary); }
        .note-input { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; box-sizing: border-box; }

        .submit-phase-btn {
            background: var(--success); color: white; border: none; padding: 12px 20px;
            font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; font-size: 15px; margin-top: 20px;
        }
        .floating-summary {
            background: #e8f2fd; border: 1px solid #b3d7ff; padding: 20px; border-radius: 12px; margin-top: 25px;
            display: flex; justify-content: space-between; align-items: center; font-weight: 700;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Digimap & Digiplus Assessment</h1>
        <div class="subtitle">Sinkronisasi Otomatis dengan Tab "Master Karyawan" & Tab "Submit"</div>
    </header>
    
    <div class="meta-box">
        <div class="form-group">
            <label>Pilih Toko / Store</label>
            <select id="storeSelect" onchange="filterStaffByStore()">
                <option value="">-- Memuat Data Toko... --</option>
            </select>
        </div>
        <div class="form-group">
            <label>Nama Staff / Sales Assistant</label>
            <select id="staffSelect">
                <option value="">-- Pilih Toko Dahulu --</option>
            </select>
        </div>
        <div class="form-group">
            <label>Tanggal Coaching</label>
            <input type="date" id="coachingDate" required>
        </div>
    </div>

    <!-- DASHBOARD 6 FASE -->
    <div id="dashboardView">
        <h3 style="margin-bottom: 15px; font-size: 16px;">Pilih Fase Asesmen:</h3>
        <div class="phase-grid" id="phaseGridContainer"></div>
        <div class="floating-summary">
            <div>Total Skor Sementara: <span id="totalScoreVal" style="color: var(--primary); font-size: 20px;">0 / 100</span></div>
        </div>
    </div>

    <!-- FORM DETAIL PER FASE -->
    <div id="phaseFormView" class="assessment-view">
        <button type="button" class="back-btn" onclick="backToDashboard()">← Kembali ke Menu Fase</button>
        <h2 id="activePhaseTitle" style="color: var(--primary); margin-top: 0;"></h2>
        <div id="phaseQuestionsContainer"></div>
        <button type="button" class="submit-phase-btn" onclick="submitCurrentPhase()">✓ Simpan & Selesaikan Fase Ini ke Google Sheets</button>
    </div>
</div>

<script>
    let employeeDatabase = [];

    // URL Web App Google Apps Script Anda yang sudah terhubung
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzGIZtO-V5OHoc5j-I6EWA0-lhFhHb0TenYq72SjuA0ULMUjS70N8VtS-lCNon1ZEdI/exec";

    // Tarik data master karyawan dari Google Sheet saat halaman dimuat
    function loadMasterData() {
        fetch(WEB_APP_URL)
        .then(response => response.json())
        .then(data => {
            employeeDatabase = data;
            let stores = [...new Set(data.map(item => item.store))];
            let storeSelect = document.getElementById('storeSelect');
            storeSelect.innerHTML = '<option value="">-- Pilih Toko --</option>';
            stores.forEach(store => {
                storeSelect.innerHTML += `<option value="${store}">${store}</option>`;
            });
        })
        .catch(error => {
            console.error("Gagal memuat master karyawan:", error);
            document.getElementById('storeSelect').innerHTML = '<option value="">Gagal memuat data toko</option>';
        });
    }

    function filterStaffByStore() {
        const store = document.getElementById('storeSelect').value;
        const staffSelect = document.getElementById('staffSelect');
        staffSelect.innerHTML = '<option value="">-- Pilih Staff --</option>';

        let filteredStaff = employeeDatabase.filter(item => item.store === store);
        filteredStaff.forEach(item => {
            staffSelect.innerHTML += `<option value="${item.name}">${item.name} (${item.role})</option>`;
        });
    }

    const phasesData = {
        "Fase 1: Foundation (Professional & Retail)": [
            { id: 1, sub: "Professional Image", detail: "Make up / Penampilan Wajah", criteria: "Penampilan wajah baik dan rapi", max: 1 },
            { id: 2, sub: "Professional Image", detail: "Smell / Aroma", criteria: "Parfum ringan & segar", max: 1 },
            { id: 3, sub: "Professional Image", detail: "Hair / Rambut", criteria: "Bersih, disisir, dan dirapikan atau ditata rapi", max: 2 },
            { id: 4, sub: "Professional Image", detail: "Uniform / Seragam", criteria: "Seragam rapih, celana hitam/navy menutupi mata kaki", max: 2 },
            { id: 5, sub: "Professional Image", detail: "Nails & Accessories", criteria: "Kuku bersih & aksesori sesuai batas wajar", max: 2 }
        ],
        "Fase 2: Engage (Percaya Diri & Bertanya)": [
            { id: 6, sub: "Percaya Diri", detail: "Bahasa Tubuh & Postur Badan", criteria: "Sikap sales assistant, postur berdiri, kontak mata", max: 4 }
        ],
        "Fase 3: Recommend (Demo & Storytelling)": [
            { id: 7, sub: "Keterampilan Demonstrasi", detail: "Product Demo & Tip Pengguna", criteria: "Demo utama produk Apple + Teknologi", max: 10 }
        ],
        "Fase 4: Asking & Analyze (Active Listening)": [
            { id: 8, sub: "Active Listening", detail: "Rapport Building & Attentiveness", criteria: "Mendengar tanpa menyela, perhatian penuh", max: 7 }
        ],
        "Fase 5: Easy Deal (Negotiation & Upselling)": [
            { id: 9, sub: "Negotiation Skills", detail: "Counter Objection & Upselling", criteria: "Solusi alternatif keberatan & upselling", max: 11 }
        ],
        "Fase 6: Settle & Support": [
            { id: 10, sub: "Garansi & Prospek", detail: "Registrasi Garansi / Pengumpulan Data", criteria: "Registrasi garansi atau pengumpulan data MAP Club", max: 5 }
        ]
    };

    const scores = {};
    const notes = {};
    const completedPhases = {};
    let activePhaseKey = "";

    function initDashboard() {
        const gridContainer = document.getElementById('phaseGridContainer');
        gridContainer.innerHTML = '';

        Object.keys(phasesData).forEach(phaseName => {
            let isDone = completedPhases[phaseName];
            let cardClass = isDone ? "phase-card completed" : "phase-card";
            gridContainer.innerHTML += `
                <div class="${cardClass}" onclick="openPhase('${phaseName}')">
                    <div class="phase-title">${phaseName}</div>
                    <div class="phase-desc">Klik untuk menilai fase ini.</div>
                    <span class="phase-badge">${isDone ? "Sudah Dinilai ✓" : "Belum Dinilai"}</span>
                </div>
            `;
        });
        calculateTotal();
    }

    function validateMeta() {
        const store = document.getElementById('storeSelect').value;
        const staff = document.getElementById('staffSelect').value;
        const date = document.getElementById('coachingDate').value;
        if (!store || !staff || !date) {
            alert('⚠️ Mohon pilih Toko, Nama Staff, dan Tanggal Coaching terlebih dahulu!');
            return false;
        }
        return true;
    }

    function openPhase(phaseName) {
        if (!validateMeta()) return;
        activePhaseKey = phaseName;
        document.getElementById('dashboardView').style.display = 'none';
        document.getElementById('phaseFormView').style.display = 'block';
        document.getElementById('activePhaseTitle').innerText = phaseName;

        const container = document.getElementById('phaseQuestionsContainer');
        container.innerHTML = '';

        phasesData[phaseName].forEach(item => {
            if (scores[item.id] === undefined) scores[item.id] = 0;
            if (notes[item.id] === undefined) notes[item.id] = '';

            let html = `
                <div class="item-card">
                    <div style="font-size: 11px; font-weight: 700; color: #6e6e73; margin-bottom: 4px;">ASPEK: ${item.sub.toUpperCase()} (Maks: ${item.max})</div>
                    <div class="item-title">${item.detail}</div>
                    <div class="criteria-text">${item.criteria}</div>
                    <div class="score-pills">
            `;
            for (let i = 0; i <= item.max; i++) {
                let isSelected = scores[item.id] === i ? 'selected' : '';
                html += `<button type="button" class="pill-btn ${isSelected}" onclick="setScore(${item.id}, ${i}, '${phaseName}')">${i}</button>`;
            }
            html += `</div>
                    <input type="text" class="note-input" value="${notes[item.id]}" oninput="setNote(${item.id}, this.value)" placeholder="Catatan opsional">
                </div>
            `;
            container.innerHTML += html;
        });
    }

    function setScore(itemId, score, phaseName) {
        scores[itemId] = score;
        openPhase(phaseName);
        calculateTotal();
    }

    function setNote(itemId, val) { notes[itemId] = val; }

    function calculateTotal() {
        let total = Object.values(scores).reduce((a, b) => a + b, 0);
        document.getElementById('totalScoreVal').innerText = `${total > 100 ? 100 : total} / 100`;
    }

    function submitCurrentPhase() {
        const store = document.getElementById('storeSelect').value;
        const staffName = document.getElementById('staffSelect').value;
        const coachingDate = document.getElementById('coachingDate').value;
        let total = Object.values(scores).reduce((a, b) => a + b, 0);

        const payload = {
            store: store,
            staffName: staffName,
            coachingDate: coachingDate,
            phaseName: activePhaseKey,
            totalScore: total > 100 ? 100 : total,
            scores: scores
        };

        alert('Mengirim data fase ke Google Sheets (Tab Submit)...');

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            completedPhases[activePhaseKey] = true;
            alert(`✅ Fase "${activePhaseKey}" berhasil tersimpan ke tab "Submit"!`);
            backToDashboard();
        })
        .catch(error => {
            alert('Gagal mengirim data: ' + error);
        });
    }

    function backToDashboard() {
        document.getElementById('phaseFormView').style.display = 'none';
        document.getElementById('dashboardView').style.display = 'block';
        initDashboard();
    }

    window.onload = loadMasterData;
</script>

</body>
</html>
