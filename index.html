<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digimap Assessment Dashboard</title>
    <style>
        :root {
            --primary: #0071e3;
            --success: #34c759;
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
            --text-secondary: #6e6e73;
            --border: #d2d2d7;
            --gray-bg: #f9f9fb;
            --radius: 14px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--card);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }
        header { text-align: center; margin-bottom: 25px; }
        h1 { font-size: 22px; font-weight: 700; margin: 0 0 5px 0; }
        .subtitle { font-size: 13px; color: var(--text-secondary); }
        
        .meta-box {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            background: var(--gray-bg);
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }
        .form-group label {
            font-weight: 600;
            font-size: 12px;
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            background: #fff;
            box-sizing: border-box;
        }

        /* Tabel Summary Store */
        .store-summary-container {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            display: none;
        }
        .store-summary-container h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: var(--primary);
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .summary-table th, .summary-table td {
            border: 1px solid var(--border);
            padding: 8px 10px;
            text-align: left;
        }
        .summary-table th {
            background: var(--gray-bg);
            font-weight: 600;
        }
        .badge-done {
            background: #dcfce7;
            color: #16a34a;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .badge-pending {
            background: #fef3c7;
            color: #d97706;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .phase-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .phase-card {
            background: var(--gray-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .phase-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        .phase-card.completed {
            border-color: var(--success);
            background: #f0fdf4;
        }
        .phase-title {
            font-weight: 700;
            font-size: 15px;
            color: var(--primary);
            margin-bottom: 5px;
        }
        .phase-card.completed .phase-title { color: #166534; }
        .phase-desc { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; }
        .phase-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 12px;
            background: #e5e5ea;
            color: #3a3a3c;
        }
        .phase-card.completed .phase-badge {
            background: #dcfce7;
            color: #16a34a;
        }

        .assessment-view { display: none; }
        .assessment-view.active { display: block; }
        
        .back-btn {
            background: #e5e5ea; border: none; padding: 8px 14px;
            font-weight: 600; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 20px;
        }
        .item-card {
            background: var(--gray-bg); border: 1px solid #e5e5ea;
            border-radius: 8px; padding: 15px; margin-bottom: 15px;
        }
        .item-title { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
        .criteria-text {
            font-size: 11px; background: #fff; padding: 10px; border-radius: 6px;
            border-left: 3px solid var(--primary); margin-bottom: 10px; white-space: pre-line;
        }
        .score-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
        .pill-btn {
            flex: 1; min-width: 40px; padding: 8px; text-align: center;
            border: 1px solid var(--border); border-radius: 6px; background: #fff;
            font-weight: 600; font-size: 13px; cursor: pointer;
        }
        .pill-btn.selected { background: var(--primary); color: #fff; border-color: var(--primary); }
        .note-input { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; box-sizing: border-box; }

        .submit-phase-btn {
            background: var(--success); color: white; border: none; padding: 12px 20px;
            font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; font-size: 15px; margin-top: 20px;
        }
        .floating-summary {
            background: #e8f2fd; border: 1px solid #b3d7ff; padding: 20px; border-radius: 12px; margin-top: 25px;
            display: flex; justify-content: space-between; align-items: center; font-weight: 700;
        }
        .status-info { background: #fffbeb; border: 1px solid #fde68a; padding: 12px 18px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; color: #92400e; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Digimap Assessment Dashboard</h1>
        <div class="subtitle">Sistem Penilaian Bertahap dengan Autofill Toko & Staff Otomatis</div>
    </header>
    
    <div class="meta-box">
        <div class="form-group">
            <label>Pilih Toko / Store</label>
            <input type="text" id="storeInput" list="storeListOptions" placeholder="Ketik atau pilih toko..." oninput="onStoreChange()" onchange="onStoreChange()" onblur="onStoreChange()">
            <datalist id="storeListOptions"></datalist>
        </div>
        <div class="form-group">
            <label>Nama Staff / Sales Assistant</label>
            <input type="text" id="staffInput" list="staffListOptions" placeholder="Pilih toko terlebih dahulu..." oninput="checkStaffProgress()" onchange="checkStaffProgress()" onblur="checkStaffProgress()">
            <datalist id="staffListOptions"></datalist>
        </div>
        <div class="form-group">
            <label>Tanggal Coaching</label>
            <input type="date" id="coachingDate" required>
        </div>
    </div>

    <!-- Tabel Ringkasan Staff Toko -->
    <div id="storeSummaryBox" class="store-summary-container">
        <h4 id="summaryStoreTitle">📊 Ringkasan Asesmen Staff Toko</h4>
        <div style="overflow-x: auto;">
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Staff</th>
                        <th>Fase Selesai</th>
                        <th>Status / Belum Selesai</th>
                    </tr>
                </thead>
                <tbody id="storeSummaryTableBody">
                    <!-- Data dimasukkan secara dinamis via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <div id="statusInfoBox" class="status-info" style="display: none;">
        🔍 <b>Status Asesmen Staff:</b> <span id="progressStatusText">Memeriksa data...</span>
    </div>

    <div id="dashboardView">
        <h3 style="margin-bottom: 15px; font-size: 16px;">Pilih Fase Asesmen yang Ingin Dinilai:</h3>
        <div class="phase-grid" id="phaseGridContainer"></div>
        <div class="floating-summary">
            <div>Total Skor Sementara: <span id="totalScoreVal" style="color: var(--primary); font-size: 20px;">0 / 100</span></div>
        </div>
    </div>

    <div id="phaseFormView" class="assessment-view">
        <button type="button" class="back-btn" onclick="backToDashboard()">← Kembali ke Menu Fase</button>
        <h2 id="activePhaseTitle" style="color: var(--primary); margin-top: 0;"></h2>
        <div id="phaseQuestionsContainer"></div>
        <button type="button" class="submit-phase-btn" onclick="submitCurrentPhase()">✓ Simpan & Kirim ke Google Sheets</button>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyiJf4zQxL2aWvJpGpRGEuPDhZDXHfO4-fQ5jpJpFCybmDzJL5emyI35aU_cKRjTnJ7/exec";

    let masterEmployees = [];
    let serverHistory = [];

    const phasesData = {
        "Fase 1: Foundation (Professional & Retail)": [
            { 
                id: 1, 
                sub: "Professional Image", 
                detail: "Make up / Penampilan Wajah", 
                criteria: "(1 Point) Penampilan wajah baik dan rapi\n• Wanita: Tata rias lengkap yang profesional dan sesuai\n• Laki-laki: Rambut wajah harus bersih dan dipangkas rapi menggunakan produk rambut\n\n(Pelanggaran apa pun tidak akan diberi skor)", 
                max: 1 
            },
            { 
                id: 2, 
                sub: "Professional Image", 
                detail: "Smell / Aroma", 
                criteria: "(1 Point) Parfum harus ringan dan segar, tidak berbau menyengat\nTidak ada bau yang tidak sedap, mis. rokok, nafas bawang putih, bau badan\n\n(Pelanggaran apa pun tidak akan diberi skor)", 
                max: 1 
            },
            { 
                id: 3, 
                sub: "Professional Image", 
                detail: "Hair / Rambut", 
                criteria: "(Range Scoring - 2 Points)\n0 Poin - Rambut tidak terawat (rambut yang terlalu pirang tidak diperbolehkan kecuali NPI)\n1 Poin - Bersih, disisir, dan dirapikan atau ditata rapi\n2 Poin - Rambut ditata dengan baik dan rapih", 
                max: 2 
            },
            { 
                id: 4, 
                sub: "Professional Image", 
                detail: "Uniform / Seragam", 
                criteria: "(2 Points)\n½ Poin - Seragam digimap/digiplus, rapih dan tidak kusut dan lusuh\n½ Poin - Celana panjang hitam/navy blue jins untuk digiplus menutupi mata kaki, bukan legging\n1 Poin - Sepatu sneakers warna gelap Bersih (samsung putih)\n\n(Pelanggaran apa pun tidak akan diberi skor)", 
                max: 2 
            },
            { 
                id: 5, 
                sub: "Professional Image", 
                detail: "Nails & Accessories", 
                criteria: "(1 Point) Tangan dan kuku bersih, terawat secara konservatif, tidak ada warna cat kuku nail art, tidak kuku extension, tidak ada kuku panjang untuk pria\n\n(Pelanggaran apa pun tidak akan diberi skor)", 
                max: 2 
            },
            { 
                id: 6, 
                sub: "Accessories", 
                detail: "Aksesoris", 
                criteria: "(1 Point) Aksesoris: Satu cincin, Satu gelang/jam tangan, Anting diperbolehkan giwang\n\n(Pelanggaran apa pun tidak akan diberi skor)", 
                max: 1 
            },
            { 
                id: 7, 
                sub: "Retail Excellence", 
                detail: "Teroganisir & Observasi", 
                criteria: "Pengaturan demo sesuai planogram", 
                max: 4 
            }
        ],
        "Fase 2: Engage (Percaya Diri & Bertanya)": [
            { id: 8, sub: "Percaya Diri", detail: "Bahasa Tubuh & Postur", criteria: "Sikap, postur berdiri, kontak mata", max: 4 },
            { id: 9, sub: "EQ & Suara", detail: "Fleksibilitas & Vokal", criteria: "Adaptif dengan tipe customer berbeda", max: 4 },
            { id: 10, sub: "Pertanyaan", detail: "Open-ended & Klarifikasi", criteria: "Minimal 4 pertanyaan terbuka", max: 8 }
        ],
        "Fase 3: Recommend (Demo & Storytelling)": [
            { id: 11, sub: "Keterampilan", detail: "Merangkum & Inisiasi Demo", criteria: "Merangkum kekhawatiran customer", max: 10 },
            { id: 12, sub: "Demonstrasi", detail: "Product Demo", criteria: "Demo utama produk Apple", max: 17 },
            { id: 13, sub: "Storytelling", detail: "Narrative & Rediscovery", criteria: "Cerita akurat & hook menarik", max: 13 }
        ],
        "Fase 4: Asking & Analyze": [
            { id: 14, sub: "Listening", detail: "Rapport & Attentiveness", criteria: "Mendengar tanpa menyela", max: 7 }
        ],
        "Fase 5: Easy Deal": [
            { id: 15, sub: "Negotiation", detail: "Counter Objection", criteria: "Solusi alternatif keberatan", max: 11 },
            { id: 16, sub: "Sales", detail: "Closing & Upselling", criteria: "Closing kreatif & upselling", max: 11 }
        ],
        "Fase 6: Settle & Support": [
            { id: 17, sub: "Garansi", detail: "Registrasi / MAP Club", criteria: "Registrasi garansi atau MAP Club", max: 5 }
        ]
    };

    const scores = {};
    const notes = {};
    const completedPhases = {};
    let activePhaseKey = "";

    window.onload = function() {
        fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
            masterEmployees = data;
            let stores = [...new Set(data.map(item => item.store ? item.store.trim() : ""))].filter(Boolean);
            let storeDatalist = document.getElementById('storeListOptions');
            storeDatalist.innerHTML = '';
            stores.forEach(store => {
                storeDatalist.innerHTML += `<option value="${store}">`;
            });
        })
        .catch(err => console.log("Gagal memuat master karyawan:", err));

        fetch(WEB_APP_URL + "?action=getHistory")
        .then(res => res.json())
        .then(data => { serverHistory = data; })
        .catch(err => console.log("Gagal memuat riwayat:", err));

        initDashboard();
    };

    function onStoreChange() {
        const storeInputVal = document.getElementById('storeInput').value.trim().toLowerCase();
        const staffDatalist = document.getElementById('staffListOptions');
        staffDatalist.innerHTML = '';
        document.getElementById('staffInput').value = '';
        document.getElementById('statusInfoBox').style.display = 'none';

        if (!storeInputVal) {
            document.getElementById('storeSummaryBox').style.display = 'none';
            return;
        }

        let filteredStaff = masterEmployees.filter(item => 
            item.store && item.store.trim().toLowerCase().includes(storeInputVal)
        );
        
        if (filteredStaff.length > 0) {
            filteredStaff.forEach(staff => {
                staffDatalist.innerHTML += `<option value="${staff.name.trim()}">`;
            });
            document.getElementById('staffInput').placeholder = "Ketik atau pilih nama staff...";
            
            renderStoreSummary(storeInputVal, filteredStaff);
        } else {
            document.getElementById('staffInput').placeholder = "-- Toko tidak ditemukan dalam Master --";
            document.getElementById('storeSummaryBox').style.display = 'none';
        }
        
        initDashboard();
    }

    function renderStoreSummary(storeQuery, staffList) {
        const summaryBox = document.getElementById('storeSummaryBox');
        const tableBody = document.getElementById('storeSummaryTableBody');
        const titleEl = document.getElementById('summaryStoreTitle');
        
        titleEl.innerText = `📊 Ringkasan Asesmen Staff Toko (${document.getElementById('storeInput').value.trim()})`;
        tableBody.innerHTML = '';
        summaryBox.style.display = 'block';

        const totalAllPhases = Object.keys(phasesData).length;

        staffList.forEach((staff, index) => {
            let staffNameLower = staff.name.trim().toLowerCase();
            let staffRecords = serverHistory.filter(r => 
                r.store && r.store.trim().toLowerCase().includes(storeQuery) && 
                r.staffName && r.staffName.trim().toLowerCase() === staffNameLower
            );

            let completedPhasesList = [];
            staffRecords.forEach(rec => {
                if (phasesData[rec.phaseName] && !completedPhasesList.includes(rec.phaseName)) {
                    completedPhasesList.push(rec.phaseName);
                }
            });

            let doneCount = completedPhasesList.length;
            let statusBadge = "";
            let detailsText = "";

            if (doneCount === totalAllPhases) {
                statusBadge = `<span class="badge-done">Selesai Semua (6/6)</span>`;
                detailsText = "Semua fase telah diselesaikan.";
            } else if (doneCount > 0) {
                let allPhaseKeys = Object.keys(phasesData);
                let missing = allPhaseKeys.filter(p => !completedPhasesList.includes(p));
                statusBadge = `<span class="badge-pending">Belum Lengkap (${doneCount}/${totalAllPhases})</span>`;
                detailsText = `Kurang: ${missing.map(m => m.split(':')[0]).join(', ')}`;
            } else {
                statusBadge = `<span class="badge-pending">Belum Dinilai (0/${totalAllPhases})</span>`;
                detailsText = "Belum ada fase yang dinilai.";
            }

            tableBody.innerHTML += `
                <tr>
                    <td style="text-align: center;">${index + 1}</td>
                    <td style="font-weight: 600;">${staff.name.trim()}</td>
                    <td>${statusBadge}</td>
                    <td style="font-size: 11px; color: var(--text-secondary);">${detailsText}</td>
                </tr>
            `;
        });
    }

    function checkStaffProgress() {
        const storeInputVal = document.getElementById('storeInput').value.trim().toLowerCase();
        const staffVal = document.getElementById('staffInput').value.trim().toLowerCase();
        const statusBox = document.getElementById('statusInfoBox');
        const statusText = document.getElementById('progressStatusText');

        Object.keys(phasesData).forEach(p => completedPhases[p] = false);

        if (!staffVal || !storeInputVal) {
            statusBox.style.display = 'none';
            initDashboard();
            return;
        }

        const staffRecords = serverHistory.filter(r => 
            r.store && r.store.trim().toLowerCase().includes(storeInputVal) && 
            r.staffName && r.staffName.trim().toLowerCase() === staffVal
        );
        
        staffRecords.forEach(rec => {
            if (phasesData[rec.phaseName]) {
                completedPhases[rec.phaseName] = true;
            }
        });

        statusBox.style.display = 'block';
        let allPhases = Object.keys(phasesData);
        let remaining = allPhases.filter(p => !completedPhases[p]);

        if (remaining.length === 0) {
            statusText.innerHTML = `<b>Sempurna!</b> Semua 6 fase asesmen untuk staff ini sudah selesai dikerjakan.`;
        } else {
            statusText.innerHTML = `<b>Sisa Kekurangan:</b> Belum menyelesaikan ${remaining.length} fase (${remaining.join(', ')}).`;
        }

        initDashboard();
    }

    function initDashboard() {
        const gridContainer = document.getElementById('phaseGridContainer');
        gridContainer.innerHTML = '';

        Object.keys(phasesData).forEach(phaseName => {
            let isDone = completedPhases[phaseName];
            let badgeText = isDone ? "Sudah Dinilai ✓" : "Belum Dinilai (Kurang)";
            let cardClass = isDone ? "phase-card completed" : "phase-card";

            gridContainer.innerHTML += `
                <div class="${cardClass}" onclick="openPhase('${phaseName}')">
                    <div class="phase-title">${phaseName}</div>
                    <div class="phase-desc">Klik untuk menilai fase ini.</div>
                    <span class="phase-badge">${badgeText}</span>
                </div>
            `;
        });
        calculateTotal();
    }

    function validateMeta() {
        const store = document.getElementById('storeInput').value.trim();
        const staff = document.getElementById('staffInput').value.trim();
        const date = document.getElementById('coachingDate').value;

        if (!store || !staff || !date) {
            alert('⚠️ Mohon isi Toko, Nama Staff, dan Tanggal Coaching terlebih dahulu!');
            return false;
        }
        return true;
    }

    function openPhase(phaseName) {
        if (!validateMeta()) return;

        activePhaseKey = phaseName;
        document.getElementById('dashboardView').style.display = 'none';
        document.getElementById('phaseFormView').style.display = 'block';
        document.getElementById('activePhaseTitle').innerText = phaseName;

        const container = document.getElementById('phaseQuestionsContainer');
        container.innerHTML = '';

        phasesData[phaseName].forEach(item => {
            if (scores[item.id] === undefined) scores[item.id] = 0;
            if (notes[item.id] === undefined) notes[item.id] = '';

            let html = `
                <div class="item-card">
                    <div style="font-size: 11px; font-weight: 700; color: #6e6e73; margin-bottom: 4px;">ASPEK: ${item.sub.toUpperCase()} (Maks: ${item.max})</div>
                    <div class="item-title">${item.detail}</div>
                    <div class="criteria-text">${item.criteria}</div>
                    <div class="score-pills">
            `;

            for (let i = 0; i <= item.max; i++) {
                let isSelected = scores[item.id] === i ? 'selected' : '';
                html += `<button type="button" class="pill-btn ${isSelected}" onclick="setScore(${item.id}, ${i}, '${phaseName}')">${i}</button>`;
            }

            html += `
                    </div>
                    <input type="text" class="note-input" value="${notes[item.id]}" oninput="setNote(${item.id}, this.value)" placeholder="Catatan opsional">
                </div>
            `;
            container.innerHTML += html;
        });
    }

    function setScore(itemId, score, phaseName) {
        scores[itemId] = score;
        openPhase(phaseName);
        calculateTotal();
    }

    function setNote(itemId, val) { notes[itemId] = val; }

    function calculateTotal() {
        let total = Object.values(scores).reduce((a, b) => a + b, 0);
        document.getElementById('totalScoreVal').innerText = `${total > 100 ? 100 : total} / 100`;
    }

    function submitCurrentPhase() {
        const store = document.getElementById('storeInput').value.trim();
        const staffName = document.getElementById('staffInput').value.trim();
        const coachingDate = document.getElementById('coachingDate').value;
        let total = Object.values(scores).reduce((a, b) => a + b, 0);

        const payload = {
            store: store,
            staffName: staffName,
            coachingDate: coachingDate,
            phaseName: activePhaseKey,
            totalScore: total > 100 ? 100 : total,
            scores: scores,
            notes: notes
        };

        alert('Mengirim data fase beserta catatan ke Google Sheets...');

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            completedPhases[activePhaseKey] = true;
            alert(`✅ Sukses! Fase "${activePhaseKey}" beserta catatannya tersimpan.`);
            checkStaffProgress();
            backToDashboard();
        })
        .catch(error => { alert('Gagal mengirim data: ' + error); });
    }

    function backToDashboard() {
        document.getElementById('phaseFormView').style.display = 'none';
        document.getElementById('dashboardView').style.display = 'block';
        initDashboard();
    }
</script>

</body>
</html>
