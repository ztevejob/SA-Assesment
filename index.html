<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digimap/Digiplus Assessment - Complete Action Tools</title>
    <style>
        :root {
            --primary: #0071e3;
            --success: #34c759;
            --whatsapp: #25d366;
            --warning: #ff9500;
            --danger: #ff3b30;
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
            --border: #d2d2d7;
            --gray-bg: #f9f9fb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #6e6e73;
            margin-bottom: 25px;
        }
        .meta-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: var(--gray-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }
        .form-group label {
            font-weight: 600;
            font-size: 13px;
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        /* Tab Navigasi Kategori */
        .category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
        }
        .tab-btn {
            font-size: 13px;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: #f1f1f6;
            color: #48484a;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .tab-btn.submitted::after {
            content: ' ✓';
            color: var(--success);
            font-weight: bold;
        }
        .category-panel {
            display: none;
        }
        .category-panel.active {
            display: block;
        }
        .panel-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e5e5ea;
        }
        .panel-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin: 0;
        }
        .btn-sub-submit {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }
        .item-card {
            background: var(--gray-bg);
            border: 1px solid #e5e5ea;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .item-header-tag {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #6e6e73;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .item-title {
            font-weight: 600;
            font-size: 15px;
            color: #000;
            margin-bottom: 8px;
        }
        .criteria-text {
            font-size: 12px;
            color: #333;
            background: #fff;
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid var(--primary);
            margin-bottom: 12px;
            white-space: pre-line;
            font-family: monospace;
        }
        .score-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .pill-btn {
            flex: 1;
            min-width: 45px;
            padding: 8px;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .pill-btn.selected {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .note-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            box-sizing: border-box;
            margin-top: 5px;
        }
        /* Bagian Panel Aksi / Tombol Bawah */
        .floating-summary {
            background: #e8f2fd;
            border: 1px solid #b3d7ff;
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
        }
        .summary-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: 700;
            font-size: 18px;
        }
        .action-buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }
        .btn-action {
            padding: 11px 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            font-size: 13px;
            color: white;
            transition: opacity 0.2s;
            text-align: center;
        }
        .btn-action:hover { opacity: 0.9; }
        .bg-primary { background: var(--primary); }
        .bg-success { background: var(--success); }
        .bg-whatsapp { background: var(--whatsapp); }
        .bg-warning { background: var(--warning); color: #1d1d1f; }
        .bg-danger { background: var(--danger); }

        @media print {
            .category-tabs, .btn-sub-submit, .action-buttons-grid, .note-input { display: none !important; }
            .category-panel { display: block !important; border: none; box-shadow: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Digimap & Digiplus Assessment</h1>
    <div class="subtitle">Sistem Penilaian Mandiri & Multi-Aksi Lengkap</div>
    
    <div class="meta-box">
        <div class="form-group">
            <label>Nama Sales Assistant</label>
            <input type="text" id="saName" required placeholder="Masukkan nama karyawan">
        </div>
        <div class="form-group">
            <label>Tanggal Coaching</label>
            <input type="date" id="coachingDate" required>
        </div>
    </div>

    <!-- Tab Kategori Utama -->
    <div class="category-tabs" id="categoryTabs"></div>

    <!-- Konten Panel Per Kategori -->
    <div id="categoryPanelsContainer"></div>

    <!-- Rekapitulasi Skor & Pilihan Aksi Tombol -->
    <div class="floating-summary">
        <div class="summary-flex">
            <span>Total Nilai Keseluruhan:</span>
            <span id="totalScoreVal" style="color: var(--primary); font-size: 22px;">0 / 100</span>
        </div>
        
        <div class="action-buttons-grid">
            <button type="button" class="btn-action bg-success" onclick="submitAllAssessment()">💾 Simpan Final</button>
            <button type="button" class="btn-action bg-primary" onclick="exportToExcel()">📊 Ekspor Excel/CSV</button>
            <button type="button" class="btn-action bg-warning" onclick="window.print()">🖨️ Cetak / PDF</button>
            <button type="button" class="btn-action bg-whatsapp" onclick="shareToWhatsApp()">💬 Bagikan via WA</button>
            <button type="button" class="btn-action bg-danger" onclick="resetForm()">🔄 Reset Formulir</button>
        </div>
    </div>
</div>

<script>
    const fullAssessmentData = {
        "1. Foundation & Retail Excellence": [
            { id: 1, sub: "Professional Image", detail: "Make up", criteria: "(1 Point) Penampilan wajah baik dan rapi", max: 1 },
            { id: 2, sub: "Professional Image", detail: "Smell", criteria: "(1 Point) Parfum ringan & segar, tidak berbau menyengat", max: 1 },
            { id: 3, sub: "Professional Image", detail: "Hair", criteria: "(2 Points) 0: Tidak terawat | 1: Bersih & rapi | 2: Ditata baik & rapi", max: 2 },
            { id: 4, sub: "Professional Image", detail: "Uniform", criteria: "(2 Points) Seragam digimap/digiplus rapih, celana sesuai standar, sneakers bersih", max: 2 },
            { id: 5, sub: "Professional Image", detail: "Nails & Accessories", criteria: "(2 Points) Kuku bersih terawat & aksesori sesuai batas wajar", max: 2 },
            { id: 6, sub: "Connect", detail: "Perkenalan & Sambutan", criteria: "(2 Points) Menyebutkan nama & sambutan standar Digimap/Digiplus", max: 2 },
            { id: 7, sub: "Connect", detail: "Engaging Customer", criteria: "(2 Points) Kontak mata & interaksi positif dengan customer", max: 2 },
            { id: 8, sub: "Retail Excellence", detail: "Teroganisir, Observasi & Tanggung Jawab", criteria: "(10 Points) Kesiapan demo produk, kebersihan toko, dan pengembalian unit", max: 10 }
        ],
        "2. Engage": [
            { id: 9, sub: "Percaya Diri", detail: "Bahasa Tubuh, Postur & Ekspresi", criteria: "(6 Points) Sikap sales assistant, postur berdiri, kontak mata, dan ekspresi", max: 6 },
            { id: 10, sub: "Fleksible & Adaptif (EQ)", detail: "Interaksi Berbagai Tipe Customer", criteria: "(3 Points) Mampu mengatur kecepatan berbicara & mengendalikan interaksi", max: 3 },
            { id: 11, sub: "Ekpresi Suara", detail: "Volume, Vokal & Profesionalisme", criteria: "(2 Points) Volume jelas, variasi vokal, serta kesopanan", max: 2 },
            { id: 12, sub: "Keterampilan Bertanya", detail: "Open Questions, Memperjelas & Klarifikasi", criteria: "(8 Points) Minimal 4 pertanyaan terbuka, menggali masalah, & klarifikasi", max: 8 }
        ],
        "3. Recommend": [
            { id: 13, sub: "Mencerminkan Keterampilan", detail: "Merangkum, Inisiasi Demo & Tip", criteria: "(10 Points) Merangkum kekhawatiran, inisiasi demo, tip pengguna", max: 10 },
            { id: 14, sub: "Keterampilan Demonstrasi", detail: "Product Demo & Creative Demo", criteria: "(17 Points) Demo utama produk Apple, demo tambahan, & demo kreatif", max: 17 },
            { id: 15, sub: "Storytelling Skills", detail: "Narrative, Relatability & Rediscovery", criteria: "(13 Points) Cerita akurat, hook, pengalaman pribadi, kosakata teknologi", max: 13 }
        ],
        "4. Easy Deal": [
            { id: 16, sub: "Active Listening", detail: "Rapport Building & Attentiveness", criteria: "(7 Points) Mendengarkan tanpa menyela, perhatian penuh, respons non-verbal", max: 7 },
            { id: 17, sub: "Negotiation Skills", detail: "Counter Objection, Positivity & Convincing", criteria: "(11 Points) Solusi alternatif keberatan, sikap positif, pencocokan teknologi", max: 11 },
            { id: 18, sub: "Sales Initiation & Maintenance", detail: "Closing, Upselling & Apple Care", criteria: "(11 Points) Closing kreatif, upselling, tips perawatan, garansi & Apple Care", max: 11 }
        ],
        "5. Settle & Support": [
            { id: 19, sub: "Purchase / Non-purchase", detail: "Garansi & Pengumpulan Data Prospek", criteria: "(5 Points) Registrasi garansi, pengumpulan data MAP Club, mengundang kembali", max: 5 }
        ]
    };

    const scores = {};
    const notes = {};
    const submittedCategories = {};

    function initApp() {
        const tabsContainer = document.getElementById('categoryTabs');
        const panelsContainer = document.getElementById('categoryPanelsContainer');

        let firstKey = Object.keys(fullAssessmentData)[0];

        Object.keys(fullAssessmentData).forEach((catName, idx) => {
            let tabId = `cat_tab_${idx}`;
            let panelId = `cat_panel_${idx}`;
            let isActive = catName === firstKey ? 'active' : '';
            let isSubmittedClass = submittedCategories[catName] ? 'submitted' : '';

            tabsContainer.innerHTML += `
                <button type="button" class="tab-btn ${isActive} ${isSubmittedClass}" id="${tabId}" onclick="switchCategoryTab('${catName}', '${tabId}')">${catName}</button>
            `;

            let panelHtml = `<div class="category-panel ${isActive}" id="${panelId}">`;
            panelHtml += `
                <div class="panel-header-flex">
                    <h2 class="panel-title">${catName}</h2>
                    <button type="button" class="btn-sub-submit" onclick="submitSingleCategory('${catName}')">✓ Simpan Kategori Ini</button>
                </div>
            `;

            fullAssessmentData[catName].forEach(item => {
                if (scores[item.id] === undefined) scores[item.id] = 0;
                if (notes[item.id] === undefined) notes[item.id] = '';

                panelHtml += `
                    <div class="item-card">
                        <div class="item-header-tag">
                            <span>ASPEK: ${item.sub.toUpperCase()}</span>
                            <span>MAKS SKOR: ${item.max}</span>
                        </div>
                        <div class="item-title">${item.detail}</div>
                        <div class="criteria-text">${item.criteria}</div>
                        <div class="score-pills">
                `;

                for (let i = 0; i <= item.max; i++) {
                    let isSelected = scores[item.id] === i ? 'selected' : '';
                    panelHtml += `<button type="button" class="pill-btn ${isSelected}" onclick="setScore(${item.id}, ${i})">${i}</button>`;
                }

                panelHtml += `
                        </div>
                        <input type="text" class="note-input" value="${notes[item.id]}" oninput="setNote(${item.id}, this.value)" placeholder="Catatan / Alasan non-scoring (opsional)">
                    </div>
                `;
            });

            panelHtml += `</div>`;
            panelsContainer.innerHTML += panelHtml;
        });
    }

    function switchCategoryTab(catName, tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.category-panel').forEach(panel => panel.classList.remove('active'));

        document.getElementById(tabId).classList.add('active');
        let keys = Object.keys(fullAssessmentData);
        let idx = keys.indexOf(catName);
        document.getElementById(`cat_panel_${idx}`).classList.add('active');
    }

    function setScore(itemId, score) {
        scores[itemId] = score;
        refreshPanelsState();
    }

    function setNote(itemId, val) {
        notes[itemId] = val;
    }

    function refreshPanelsState() {
        let activeTabId = document.querySelector('.tab-btn.active')?.id;
        document.getElementById('categoryPanelsContainer').innerHTML = '';
        document.getElementById('categoryTabs').innerHTML = '';
        initApp();
        calculateTotal();
        // Restore active tab
        if(activeTabId) {
            let activeCatBtn = document.getElementById(activeTabId);
            if(activeCatBtn) activeCatBtn.click();
        }
    }

    function calculateTotal() {
        let total = Object.values(scores).reduce((a, b) => a + b, 0);
        let finalTotal = total > 100 ? 100 : total;
        document.getElementById('totalScoreVal').innerText = `${finalTotal} / 100`;
    }

    function submitSingleCategory(catName) {
        const name = document.getElementById('saName').value;
        if (!name) { alert('Mohon isi Nama Sales Assistant terlebih dahulu.'); return; }
        submittedCategories[catName] = true;
        refreshPanelsState();
        alert(`Kategori "${catName}" berhasil disimpan!`);
    }

    function submitAllAssessment() {
        const name = document.getElementById('saName').value;
        const date = document.getElementById('coachingDate').value;
        if (!name || !date) { alert('Mohon lengkapi Nama dan Tanggal Coaching.'); return; }
        let total = Object.values(scores).reduce((a, b) => a + b, 0);
        alert(`Penilaian untuk ${name} berhasil disimpan final!\nTotal Skor: ${total > 100 ? 100 : total} / 100`);
    }

    function exportToExcel() {
        const name = document.getElementById('saName').value || 'Unknown';
        const date = document.getElementById('coachingDate').value || 'N/A';
        let csvContent = "data:text/csv;charset=utf-8,ID Aspek,Detail Aspek,Skor,Catatan\n";
        
        Object.values(fullAssessmentData).forEach(catItems => {
            catItems.forEach(item => {
                csvContent += `${item.id},"${item.detail}",${scores[item.id]},"${notes[item.id] || ''}"\n`;
            });
        });

        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Assessment_${name.replace(/\s+/g, '_')}_${date}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function shareToWhatsApp() {
        const name = document.getElementById('saName').value || '-';
        const date = document.getElementById('coachingDate').value || '-';
        let total = Object.values(scores).reduce((a, b) => a + b, 0);
        
        let message = `*HASIL ASESMEN SALES ASSISTANT*\n` +
                      `👤 Nama: ${name}\n` +
                      `📅 Tanggal: ${date}\n` +
                      `⭐ Total Skor: ${total > 100 ? 100 : total} / 100\n\n` +
                      `Silفظ Hubungi Store Trainer untuk detail evaluasi lebih lanjut.`;

        let whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, '_blank');
    }

    function resetForm() {
        if(confirm('Apakah Anda yakin ingin mereset seluruh formulir?')) {
            for(let k in scores) scores[k] = 0;
            for(let k in notes) notes[k] = '';
            for(let k in submittedCategories) delete submittedCategories[k];
            document.getElementById('saName').value = '';
            document.getElementById('coachingDate').value = '';
            refreshPanelsState();
        }
    }

    window.onload = initApp;
</script>

</body>
</html>
